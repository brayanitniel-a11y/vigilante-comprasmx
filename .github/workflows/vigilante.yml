name: Vigilante ComprasMX

on:
  schedule:
    # Minutos "raros" a proposito: GitHub descarta muchas ejecuciones programadas en :00, :05, :10...
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Calibracion: uno o varios numeros de procedimiento separados por espacio o coma (vacio = corrida normal)"
        required: false
        default: ""
  push:
    branches: [calibrar, main]   # 'calibrar' = calibracion automatica (probe.txt); 'main' = corrida normal al subir cambios

concurrency:
  group: vigilante
  cancel-in-progress: false

permissions:
  contents: write                # para publicar el resultado de la calibracion en una rama aparte
  actions: write                 # para limpiar cachés viejas de estado

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
      STATE_PATH: state/state.json
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4

      - name: Decidir modo (normal o calibracion)
        id: modo
        env:
          INPUT_PROBE: ${{ github.event.inputs.probe }}
        run: |
          P="$(echo "$INPUT_PROBE" | tr ',' ' ')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "calibrar" ] && [ -f probe.txt ]; then
            P="$(grep -v '^#' probe.txt | tr ',\n' '  ')"   # uno o varios numeros, uno por linea
          fi
          P="$(echo $P)"
          echo "probe=$P" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Recuperar estado (lista de procedimientos)
        if: ${{ steps.modo.outputs.probe == '' }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-none
          restore-keys: state-

      - name: Calibracion
        if: ${{ steps.modo.outputs.probe != '' }}
        continue-on-error: true
        env:
          PROBE: ${{ steps.modo.outputs.probe }}
        run: |
          mkdir -p debug
          set -o pipefail
          python bot.py probe $PROBE 2>&1 | tee debug/resultado.txt

      - name: Corrida normal
        if: ${{ steps.modo.outputs.probe == '' }}
        run: python bot.py once

      - name: Guardar estado
        if: ${{ always() && steps.modo.outputs.probe == '' }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Subir capturas de depuracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Publicar resultado de la calibracion (rama calibracion-resultado)
        if: ${{ always() && steps.modo.outputs.probe != '' }}
        env:
          PROBE: ${{ steps.modo.outputs.probe }}
        run: |
          mkdir -p debug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan calibracion-resultado
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f debug
          git commit -q -m "Resultado de calibracion: $PROBE"
          git push -f origin calibracion-resultado

      - name: Limpiar cachés de estado viejas (deja las 3 más recientes)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true
