name: Vigilante ComprasMX

on:
  schedule:
    - cron: "*/5 * * * *"        # cada 5 minutos (minimo que permite GitHub; puede retrasarse)
  workflow_dispatch:
    inputs:
      probe:
        description: "Calibracion: numero de procedimiento a probar (dejalo vacio para una corrida normal)"
        required: false
        default: ""

concurrency:
  group: vigilante
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                 # solo para limpiar cachés viejas de estado

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
      STATE_PATH: state/state.json
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Recuperar estado (lista de procedimientos)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-none
          restore-keys: state-

      - name: Calibracion (solo si escribiste un numero al lanzarlo a mano)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe != '' }}
        run: python bot.py probe "${{ inputs.probe }}"

      - name: Corrida normal
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe != '') }}
        run: python bot.py once

      - name: Guardar estado
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.probe != '') }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Subir capturas de depuracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Limpiar cachés de estado viejas (deja las 3 más recientes)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true
